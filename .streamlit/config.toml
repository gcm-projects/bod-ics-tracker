# Streamlit configuration shared by local and deployed runs.
# Secrets are NOT stored here — they live in the git-ignored secrets.toml
# (see secrets.toml.example). This file is safe to commit.

[browser]
# Don't send anonymous usage statistics to Streamlit.
gatherUsageStats = false

# Pin the app to dark mode for all viewers. Streamlit exposes no reliable hook
# for a per-viewer theme (st.context.theme lags; there's no CSS attribute for
# the in-app toggle — streamlit#5009/#11920), so we fix the theme and pair it
# with the white "GCM" logo, which is then always correct.
[theme]
base = "dark"
